<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="35%" stop-color="#1E1B4B" />
      <stop offset="70%" stop-color="#31103F" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#FF2E93" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="url(#bannerBg)" />

  <!-- Ambient Decorative Grid / Circles -->
  <circle cx="200" cy="150" r="280" fill="none" stroke="rgba(255, 46, 147, 0.08)" stroke-width="2" />
  <circle cx="1450" cy="450" r="320" fill="none" stroke="rgba(124, 58, 237, 0.12)" stroke-width="2" />
  <circle cx="1450" cy="450" r="200" fill="none" stroke="rgba(255, 46, 147, 0.1)" stroke-width="2" stroke-dasharray="12 12" />

  <!-- Left: Main Logo Mark -->
  <g transform="translate(240, 290)" filter="url(#bannerGlow)">
    <rect x="-95" y="-95" width="190" height="190" rx="48" fill="url(#accentPink)" />
    <!-- 5-Point Star -->
    <polygon points="0,-58 18,-17 63,-12 29,18 39,63 0,40 -39,63 -29,18 -63,-12 -18,-17" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="390" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#FFFFFF" letter-spacing="-2">
    Stars<tspan fill="#FF2E93">Bio</tspan>
  </text>

  <!-- Subtitle -->
  <text x="395" y="335" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#CBD5E1">
    Celebrity Birthdays, Real Ages, Zodiac Facts &amp; Full Biographies
  </text>

  <!-- Badges / Features Pills -->
  <g transform="translate(395, 375)">
    <!-- Pill 1: 17k+ Celebrities -->
    <rect x="0" y="0" width="240" height="42" rx="21" fill="rgba(255, 46, 147, 0.15)" stroke="rgba(255, 46, 147, 0.4)" />
    <text x="120" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#F472B6" text-anchor="middle">
      ★ 17,500+ CELEBRITIES
    </text>

    <!-- Pill 2: Daily Today Updates -->
    <rect x="255" y="0" width="230" height="42" rx="21" fill="rgba(124, 58, 237, 0.15)" stroke="rgba(124, 58, 237, 0.4)" />
    <text x="370" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#A78BFA" text-anchor="middle">
      🎂 DAILY BIRTHDAYS
    </text>

    <!-- Pill 3: Head to Head Comparisons -->
    <rect x="500" y="0" width="220" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="610" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">
      ⚖ A-Z COMPARISONS
    </text>
  </g>

  <!-- Right Website URL Box -->
  <g transform="translate(1360, 290)">
    <rect x="-180" y="-45" width="360" height="90" rx="24" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="0" y="-8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
      OFFICIAL WEBSITE
    </text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#38BDF8" text-anchor="middle">
      www.starbio.co.uk
    </text>
  </g>
</svg>