<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF2E93" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Circle/Rounded -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Subtle Circular Rings -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="rgba(255, 46, 147, 0.15)" stroke-width="2" />
  <circle cx="400" cy="400" r="280" fill="none" stroke="rgba(124, 58, 237, 0.2)" stroke-width="2" stroke-dasharray="10 10" />

  <!-- Glowing Central Icon Badge -->
  <g transform="translate(400, 310)" filter="url(#glow)">
    <rect x="-120" y="-120" width="240" height="240" rx="60" fill="url(#starGrad)" />
    <!-- 5-Point Star -->
    <polygon points="0,-72 23,-21 78,-15 36,23 48,78 0,50 -48,78 -36,23 -78,-15 -23,-21" fill="#FFFFFF" />
  </g>

  <!-- Brand Name Text -->
  <text x="400" y="540" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">
    Stars<tspan fill="#FF2E93">Bio</tspan>
  </text>

  <!-- Tagline Badge -->
  <rect x="250" y="585" width="300" height="44" rx="22" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" />
  <text x="400" y="613" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#F472B6" text-anchor="middle" letter-spacing="2">
    CELEBRITY WIKI
  </text>
</svg>