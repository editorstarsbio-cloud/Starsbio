<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <filter id="glow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF2E93" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Central Star Badge -->
  <g transform="translate(600, 230)" filter="url(#glow)">
    <rect x="-80" y="-80" width="160" height="160" rx="40" fill="url(#starGrad)" />
    <polygon points="0,-48 15,-14 52,-10 24,15 32,52 0,33 -32,52 -24,15 -52,-10 -15,-14" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    Stars<tspan fill="#FF2E93">Bio</tspan><tspan fill="#F43F5E" font-size="36">.co.uk</tspan>
  </text>

  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="26" fill="#94A3B8" text-anchor="middle">
    Celebrity Birthdays, Real Ages, Zodiac Profiles &amp; Verified Biographies
  </text>

  <rect x="420" y="480" width="360" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
  <text x="600" y="508" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#F472B6" text-anchor="middle" letter-spacing="1">
    OVER 17,000+ FACT-CHECKED PROFILES
  </text>
</svg>
