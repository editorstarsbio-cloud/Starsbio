<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#FF5B71" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#FFE17D" />
    </linearGradient>

    <!-- Deep Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFDE6A" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#softShadow)" />

  <!-- Inner Subtle Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Primary 5-Point Celebrity Star Icon -->
  <g filter="url(#starGlow)">
    <polygon points="256,92 298,188 402,198 324,268 346,370 256,318 166,370 188,268 110,198 214,188"
             fill="url(#starGrad)" />
  </g>

  <!-- Secondary Mini Sparkle (Upper Right) -->
  <path d="M374,106 Q382,126 402,134 Q382,142 374,162 Q366,142 346,134 Q366,126 374,106 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Tertiary Mini Sparkle (Bottom Left) -->
  <path d="M128,340 Q134,354 148,360 Q134,366 128,380 Q122,366 108,360 Q122,354 128,340 Z" fill="#FFFFFF" opacity="0.85" />

  <!-- Stylized Modern 'B' ribbon in the center of the star -->
  <circle cx="256" cy="248" r="28" fill="#FF2E93" opacity="0.9" />
  <circle cx="256" cy="248" r="16" fill="#FFFFFF" />
</svg>
